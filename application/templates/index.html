<!DOCTYPE html>
<html>
<head>
    <title>NYC Weather</title>
</head>

<body>

    <h1>New York Weather</h1>

    <p>Location: {{ weather.location }}</p>
    <p>Temperature: {{ weather.temperature }} °C</p>
    <p>Wind: {{ weather.wind }} km/h</p>
    <p>Humidity: {{ weather.humidity }} %</p>
    <p>Timestamp: {{ weather.timestamp }}</p>

</body>
</html>
